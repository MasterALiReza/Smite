# Smite Node - Docker Compose Configuration
# Usage: cd node && docker compose up -d

services:
  smite-node:
    image: ghcr.io/masteralireza/smite-node:${SMITE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smite-node
    network_mode: host
    pid: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./certs:/etc/smite-node/certs:ro
      - ./config:/etc/smite-node
      - node-data:/var/lib/smite-node
    env_file:
      - .env
    environment:
      - NODE_API_PORT=${NODE_API_PORT:-8888}
      - NODE_NAME=${NODE_NAME:-node-1}
      - PANEL_CA_PATH=${PANEL_CA_PATH:-/etc/smite-node/certs/ca.crt}
      - PANEL_ADDRESS=${PANEL_ADDRESS}
      - PANEL_API_PORT=${PANEL_API_PORT:-8000}
    restart: unless-stopped
    healthcheck:
      # Accepts both the legacy HTTP agent and the pinned-HTTPS agent so a staged
      # rollout never marks an older container unhealthy.
      test:
        - CMD-SHELL
        - |
          python - <<'PY'
          import os, ssl, sys, urllib.request
          port = os.environ.get("NODE_API_PORT", "8888")
          for scheme, context in (("https", ssl._create_unverified_context()), ("http", None)):
              try:
                  urllib.request.urlopen(f"{scheme}://localhost:{port}/api/agent/status", context=context, timeout=3)
                  sys.exit(0)
              except Exception:
                  continue
          sys.exit(1)
          PY
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Drop all capabilities except those needed
    security_opt:
      - no-new-privileges:true

volumes:
  node-data:
    driver: local
    name: smite-node-data
