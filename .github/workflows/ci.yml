name: CI

on:
  push:
    branches: [main, master, next]
  pull_request:

jobs:
  python-lint:
    name: Python lint & syntax (panel + node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff (CI only)
        run: pip install ruff
      - name: Ruff lint
        run: |
          ruff check panel/app panel/main.py node/app node/main.py
      - name: Syntax compile check
        run: |
          python -m compileall -q panel/app panel/main.py node/app node/main.py

  frontend-build:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      # NOTE: `tsc --noEmit` is intentionally omitted until the pre-existing
      # TS errors in Tunnels.tsx/LanguageContext.tsx are fixed (see audit plan
      # phase 3). Vite build itself does not type-check.
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build panel image
        run: docker build -f panel/Dockerfile .
      - name: Build node image
        run: docker build -f node/Dockerfile .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile frontend/
